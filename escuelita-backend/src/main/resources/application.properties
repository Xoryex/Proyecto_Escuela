spring.application.name=ProyectoEscuelaPrimaria

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Inicializacion de base de datos (desactivado por defecto para no sobrescribir datos existentes)
spring.sql.init.mode=never
spring.sql.init.schema-locations=
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=true

spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Limites de subida de archivos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Seguridad JWT (configurable via .env; minimo 32 caracteres)
jwt.secret=${JWT_SECRET:Siae2026JwtSecretKey9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c}
jwt.expiration.ms=${JWT_EXPIRATION_MS:604800000}

# Configuracion API Decolecta RENIEC (token externalizado a .env)
decolecta.api.url=${DECOLECTA_API_URL:https://api.decolecta.com/v1}
decolecta.api.token=${DECOLECTA_API_TOKEN:}
